  <h1>إرساء <span class="i"><span>&mdash;</span></span> مصحف&nbsp;تفاعلي لاختبار&nbsp;الحفظ</h1>
  <p>أظهر هذه الشاشة في أي وقت بضغط <nobr>زر <kbd>F1</kbd></nobr> أو <nobr>زر <kbd>Tab</kbd></nobr> في لوحة المفاتيح، أو <nobr>زر <span class="sh"><button disabled>؟</button><span></span></span></nobr> الذي في أعلى الشاشة.</p>
  <details><summary>للتسميع أسلوبان: إظهار الكلمات بالأسهم، وبالكتابة.</summary>
    <p>ويمكن التبديل بينهما وقتما شئت:</p><ul>
      <li>زر الإدخال (<kbd>Enter</kbd>) في التسميع بالإظهار يجعل التسميع بالكتابة.
      <li>زر الخروج (<kbd>Escape</kbd>) في التسميع بالكتابة يجعل التسميع بالإظهار.
    </ul>
    <p>ولمستخدمي الفأرة وشاشة اللمس:</p><ul>
      <li>النقر المزدوج خارج خانة الكتابة يجعل التسميع بالإظهار.
      <li>تحريك عجلة الفأرة أو السحب على شاشة اللمس ينتقلان بالكلمة.
    </ul>
    <p>عند التسميع بالكتابة:</p><ul>
      <li>اكتب الكلمة بالرسم الإملائي وبغير تشكيل، ثم اضغط مسافة.
      <li>للمساعدة يمكن إظهار الكلمة قليلا بضغط زر <kbd>#</kbd> (العالي + ٣). يجب أن تكون الخانة فارغة لتظهر فيها المساعدة.
      <li>لإضافة الحرف التالي من الكلمة، اضغط زر <kbd>!</kbd> (العالي + ١).
    </ul>
    <p>عند التسميع بالإظهار:</p><ul>
      <li>زر المسافة (<kbd>&emsp;&emsp;&emsp;&emsp;&emsp;</kbd>) وزر سهم يسار (<kbd>←</kbd>) يظهران الكلمة التالية.
      <li>زر التراجع (<kbd>Backspace</kbd>) وزر سهم يمين (<kbd>→</kbd>) يخفيان الكلمة السابقة.
      <li>زر سهم أسفل (<kbd>↓</kbd>) يظهر «العبارة» التالية، أي حتى موضع يجوز الوقوف عليه (عنده علامة وقف أو فراغ اختياري أو نهاية آية أو غير ذلك).
      <li>زر سهم أعلى (<kbd>↑</kbd>) يخفي «العبارة» السابقة.
    </ul>
    <p>وفي كليهما:</p><ul>
      <li>الزران اللذان بجوار <kbd>Backspace</kbd> (الشرطة والتساوي) ينتقلان بالكلمة، مهما كان تخطيط لوحة مفاتيحك.
      <li>ضغط زر العالي (<kbd>Shift</kbd>) مع أي زر من أزرار الانتقال بالكلمة ينتقل بالعبارة.
      <!-- <li>ضغط <kbd>Ctrl</kbd> مع <kbd>F12</kbd> يظهر رابط الصفحة حتى الكلمة الحالية، لتحفظ موضعك عند التسميع أو القراءة. -->
    </ul>
  </details>
  <details><summary>الانتقال بالصفحات:</summary>
    <ul>
      <li>«الشاشة» هي صفحتان متقابلتان للشاشات العريضة، وصفحة واحدة لغيرها.
      <li>ضغط <kbd>PageDown</kbd> ينتقل شاشة كاملة إلى الأمام، ويظهر الصفحات فارغة.
      <li>ضغط <kbd>PageUp</kbd> ينتقل شاشة كاملة إلى الخلف، ويظهر الصفحات فارغة.
      <li>ضغط <kbd>Shift</kbd> مع <kbd>PageDown</kbd> ينتقل شاشة كاملة إلى الأمام، ويظهر الصفحات كاملة.
      <li>ضغط <kbd>Shift</kbd> مع <kbd>PageUp</kbd> ينتقل شاشة كاملة إلى الخلف، ويظهر الصفحات كاملة.
      <li>ضغط <kbd>Ctrl</kbd> مع <kbd>Home</kbd> يخفي كلمات الصفحة الحالية. (وكذلك <kbd>Home</kbd> وحده عند التسميع بالإظهار.)
      <li>ضغط <kbd>Ctrl</kbd> مع <kbd>End</kbd> يظهر الصفحة الحالية كاملة. (وكذلك <kbd>End</kbd> وحده عند التسميع بالإظهار.)
    </ul>
  </details>
